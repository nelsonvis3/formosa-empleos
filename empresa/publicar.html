<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicar empleo - Formosa Empleos</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .publicar-header {
        margin: 2rem 0 1.5rem 0;
      }
      .fila-doble {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      @media (max-width: 560px) {
        .fila-doble {
          grid-template-columns: 1fr;
        }
      }
      .toggle-campo {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.2rem;
        padding: 0.9rem 1rem;
        background: var(--gris-claro);
        border-radius: 8px;
      }
      .toggle-campo input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .toggle-campo label {
        margin: 0;
        cursor: pointer;
      }
      .campos-formulario-lista {
        margin-bottom: 1.2rem;
      }
      .campo-formulario-item {
        border: 1px solid var(--linea);
        border-radius: var(--radio);
        padding: 0.9rem;
        margin-bottom: 0.7rem;
      }
      .campo-formulario-fila {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .campo-formulario-fila input[type="text"] {
        flex: 1;
      }
      .campo-formulario-fila select {
        width: auto;
        flex-shrink: 0;
      }
      .campo-opciones-wrap {
        margin-top: 0.5rem;
      }
      .campo-opciones-wrap input {
        margin-bottom: 0.4rem;
      }
      .btn-quitar-campo {
        background: transparent;
        border: 1px solid var(--gris-claro);
        border-radius: var(--radio);
        padding: 0 0.9rem;
        color: var(--rojo-error);
        flex-shrink: 0;
      }
      .btn-agregar-campo {
        background: transparent;
        border: 1px dashed var(--gris-claro);
        border-radius: var(--radio);
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        color: var(--gris);
        width: 100%;
      }
      .btn-agregar-campo:hover {
        border-color: var(--negro);
        color: var(--negro);
      }
    </style>
  </head>
  <body>
    <header class="sitio-header">
      <a href="../index.html" class="logo">Formosa<span>Empleos</span></a>
      <nav>
        <a href="dashboard.html">← Volver a mis empleos</a>
      </nav>
    </header>

    <div class="contenedor">
      <div class="publicar-header">
        <h1>Publicar un nuevo empleo</h1>
      </div>

      <form id="form-publicar" class="tarjeta">
        <div class="campo">
          <label for="titulo">Título del puesto</label>
          <input
            type="text"
            id="titulo"
            required
            placeholder="Ej: Vendedor/a de local"
          />
        </div>

        <div class="campo">
          <label for="descripcion">Descripción</label>
          <textarea
            id="descripcion"
            required
            placeholder="Tareas, requisitos, horarios, beneficios..."
          ></textarea>
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label for="rubro">Rubro</label>
            <input
              type="text"
              id="rubro"
              placeholder="Ej: Comercio, Gastronomía"
            />
          </div>
          <div class="campo">
            <label for="modalidad">Modalidad</label>
            <select id="modalidad">
              <option value="presencial">Presencial</option>
              <option value="remoto">Remoto</option>
              <option value="hibrido">Híbrido</option>
            </select>
          </div>
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label for="salario_desde">Salario desde (opcional)</label>
            <input type="number" id="salario_desde" min="0" placeholder="$" />
          </div>
          <div class="campo">
            <label for="salario_hasta">Salario hasta (opcional)</label>
            <input type="number" id="salario_hasta" min="0" placeholder="$" />
          </div>
        </div>

        <div class="toggle-campo">
          <input
            type="checkbox"
            id="requiere_formulario"
            onchange="toggleFormularioPersonalizado()"
          />
          <label for="requiere_formulario">
            Pedir un formulario corto al postularse (en vez de postulación
            directa con CV)
          </label>
        </div>

        <div id="seccion-campos-formulario" class="oculto">
          <label
            style="
              display: block;
              font-size: 0.9rem;
              font-weight: 500;
              margin-bottom: 0.5rem;
            "
          >
            Preguntas del formulario
          </label>
          <div id="campos-formulario-lista" class="campos-formulario-lista">
            <!-- Se llenan dinámicamente -->
          </div>
          <button
            type="button"
            class="btn-agregar-campo"
            onclick="agregarCampoFormulario()"
          >
            + Agregar pregunta
          </button>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 0.8rem">
          <button type="submit" class="btn btn-primario">
            Publicar empleo
          </button>
          <a href="dashboard.html" class="btn btn-secundario">Cancelar</a>
        </div>

        <p class="mensaje-error oculto" id="error-publicar"></p>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/api.js"></script>
    <script src="publicar.js"></script>
  </body>
</html>
