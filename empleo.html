<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del empleo - Formosa Empleos</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .detalle-wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
      }
      .volver-link {
        display: inline-block;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
      }
      .detalle-header .empresa-nombre {
        color: var(--terracota);
        font-weight: 500;
        font-size: 0.95rem;
      }
      .detalle-header h1 {
        margin-top: 0.3rem;
        margin-bottom: 0.6rem;
      }
      .detalle-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .detalle-tags .tag {
        font-size: 0.8rem;
        color: var(--gris);
        background: var(--crema);
        border: 1px solid var(--gris-claro);
        padding: 0.25rem 0.7rem;
        border-radius: 100px;
      }
      .detalle-salario {
        color: var(--verde-monte);
        font-weight: 500;
        margin-bottom: 1.5rem;
      }
      .detalle-descripcion {
        white-space: pre-wrap;
        line-height: 1.7;
        margin-bottom: 2rem;
      }
      .empresa-box {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 1rem;
        background: var(--blanco);
        border: 1px solid var(--gris-claro);
        border-radius: 10px;
        margin-bottom: 2rem;
      }
      .empresa-box p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--gris);
      }

      .card {
        background-color: whitesmoke;
        width: 100%;
        height: auto;
        padding: 25px;
        border: 0.5px solid black;
        border-radius: 7px;
      }

      .postulacion-box {
        background: var(--blanco);
        border: 1px solid var(--gris-claro);
        border-radius: 10px;
        padding: 1.5rem;
      }
      .postulacion-box h3 {
        margin-bottom: 1rem;
      }
      .estado-ya-postulado {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--verde-monte);
        font-weight: 500;
      }
      .cargando {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--gris);
      }
    </style>
  </head>
  <body>
    <header class="sitio-header">
      <a href="index.html" class="logo">Formosa<span>Empleos</span></a>
      <nav id="nav-links"></nav>
    </header>

    <div id="vista-cargando" class="cargando">Cargando empleo...</div>

    <div id="vista-detalle" class="detalle-wrap oculto">
      <div class="card">
        <a href="index.html" class="volver-link">← Volver al listado</a>

        <div class="detalle-header">
          <span class="empresa-nombre" id="empleo-empresa"></span>
          <h1 id="empleo-titulo"></h1>
          <div class="detalle-tags" id="empleo-tags"></div>
          <p class="detalle-salario oculto" id="empleo-salario"></p>
        </div>

        <p class="detalle-descripcion" id="empleo-descripcion"></p>

        <div class="empresa-box">
          <div>
            <strong id="empresa-nombre-box"></strong>
            <p id="empresa-descripcion-box"></p>
          </div>
        </div>

        <div class="postulacion-box" id="caja-postulacion">
          <!-- Se llena dinámicamente según el estado de sesión / postulación -->
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/empleo.js"></script>
  </body>
</html>
